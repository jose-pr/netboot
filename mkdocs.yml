site_name: netboot
site_description: PXE provisioning management — render netboot artifacts and drive DHCP for targets
site_author: jose-pr
repo_url: https://github.com/jose-pr/netboot/
repo_name: jose-pr/netboot
site_url: https://jose-pr.github.io/netboot/
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences

nav:
  - Home: index.md
  - CLI: cli.md
  - Configuration: configuration.md
  - Extending: extending.md
  - API Reference: api.md
  - Changelog: changelog.md
