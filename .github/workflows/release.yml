name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release, for example v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all extras
        run: python -m pip install -e ".[dev,docs,config,http]"

      - name: Run tests
        run: python -m pytest tests -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs-gate:
    name: Docs build gate
    needs: test
    runs-on: ubuntu-latest
    # Builds the site strictly but never deploys: a broken docs site must block
    # the release without the release owning deployment. docs.yml owns every
    # Pages deploy, so a docs-only problem can never overwrite a live site from
    # here (an older tag's run did exactly that once).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,config,http]"

      - name: Build docs (strict, not deployed)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG.md section for this tag
        shell: python
        run: |
          import os
          import pathlib
          import re
          import sys

          ref = os.environ["RELEASE_REF"]
          tag = ref.rsplit("/", 1)[-1]
          version = tag[1:] if tag.startswith("v") else tag

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          # Pin the release to the tagged commit. Left unset, the action falls
          # back to the repository's default branch, and a release object
          # carrying a stale branch name (e.g. "master" after a rename to
          # "main") makes generate_release_notes fail with
          # "Invalid target_commitish".
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name, '-') }}
          body_path: release_notes.md

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netboot/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI never replaces a version: on a re-run of a partly-finished
          # release, skip what is already uploaded instead of hard-failing.
          skip-existing: true

  docs-dispatch:
    name: Deploy docs for this tag
    needs: [publish-pypi, docs-gate]
    runs-on: ubuntu-latest
    # docs.yml also listens for `release: published`, but a release created by
    # this workflow's GITHUB_TOKEN starts no workflow run at all -- measured on
    # a sibling repo: zero `release`-triggered docs runs across five releases.
    # workflow_dispatch is exempt from that rule, so ask for the deploy here.
    permissions:
      actions: write
    steps:
      - name: Trigger the docs workflow for the released ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF"
