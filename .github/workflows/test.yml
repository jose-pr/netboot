name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
  push:
    branches:
      - '**'
    tags:
      - ci-*
  pull_request:

# Nothing here needs to write to the repo, and this workflow runs third-party
# code from the dependency tree; the repo default is read+write.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the edges on the other two
        # platforms: path handling and default encodings differ there, and
        # netboot builds file/URI paths on every render.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run tests
        run: python -m pytest tests -q -rs

      - name: Build docs
        run: python -m mkdocs build --strict

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  package:
    name: Built wheel smoke test
    runs-on: ubuntu-latest
    # Everything else runs against the checkout (`pythonpath = ["src"]`), so
    # nothing notices a file that is not packaged or a dependency that is only
    # present by accident -- which is how a release shipped without `requests`.
    # This job runs from a directory where the checkout is not importable.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/python -m pip install dist/*.whl

      - name: Smoke-test the installed package
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/pixie --version
          /tmp/wheelenv/bin/pixie initiate --help
          /tmp/wheelenv/bin/python -c "
          import importlib.resources as res, netboot
          from netboot import Pixie
          # The shipped docs must actually be in the package.
          for name in ('AGENTS.md', 'README.md', 'py.typed'):
              assert res.files('netboot').joinpath(name).is_file(), name
          engine = Pixie(
              images={'debian': {'template_path': []}},
              dhcpzones={'lan': {'network': '10.0.0.0/24'}},
              targets={'host1': {'ip': '10.0.0.5', 'image': 'debian'}},
          )
          ctx = engine.make_context(engine.lookup_target('host1'))
          print('rendered from the installed wheel:', ctx.version)
          "

      - name: An http repo needs no extra
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python -c "
          from netboot.content import Repository
          repo = Repository(address='10.0.0.1', services={'http': '/boot'})
          print('http service from the wheel:', repo.service('http'))
          "

      - name: The extras install and work from the built wheel
        working-directory: /tmp
        run: |
          # Not --no-index: the extras' own dependencies come from PyPI, only
          # netboot itself comes from dist/.
          /tmp/wheelenv/bin/python -m pip install "netboot[config]"             --find-links "$GITHUB_WORKSPACE/dist"
          /tmp/wheelenv/bin/python -c "
          import anycfg, yaml
          print('config extra: anycfg', anycfg.__version__, 'pyyaml', yaml.__version__)
          "
