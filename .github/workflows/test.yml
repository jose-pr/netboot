name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
  push:
    branches:
      - '**'
    tags:
      - ci-*
  pull_request:

# Nothing here needs to write to the repo, and this workflow runs third-party
# code from the dependency tree; the repo default is read+write.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the edges on the other two
        # platforms: path handling and default encodings differ there, and
        # netboot builds file/URI paths on every render.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs,config,http]

      - name: Run tests
        run: python -m pytest tests -q -rs

      - name: Build docs
        run: python -m mkdocs build --strict
