[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netboot"
version = "0.4.0"
authors = [{ name = "Jose A." }]
description = "PXE provisioning management: render netboot artifacts and drive DHCP for targets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Boot",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "duho>=0.7.5,<0.8",
    # The 0.4 series has `split_host`, `MACAddress.format` and
    # `MACAddress.is_valid`, all of which netboot calls. `resolve()` answers [] by
    # default (strict=False) -- PixieTarget relies on that, since every target
    # is built at startup and a raise would fail every command.
    "netimps>=0.4.0,<0.5",
    # The path layer and its URI layer (`http`, `file`, `ftp`, ... services,
    # and the `sftp://` class sftppath registers). Both run on the standard
    # library; the 0.1 series is the first with the `uripath` import name.
    "pathapi>=0.1.0,<0.2",
    "pathapi-uri>=0.1.0,<0.2",
    # Templates are rendered by tplx; `.j2` is the engine netboot's own
    # examples and docs use, so it is always installed.
    "tplx[jinja]>=0.1.0,<0.2",
    # 3.0 is the floor that can actually be imported: 2.x calls
    # markupsafe.soft_unicode, removed in MarkupSafe 2.1, so an unpinned
    # resolve can install a jinja2/markupsafe pair that fails on import. The
    # CLI reports jinja2's errors from config interpolation itself.
    "jinja2>=3.0,<4",
    # 0.13.1 is the first release built on pathapi; 0.13.0 is built on
    # pathlib-next, whose path classes are not the ones netboot passes it.
    "yaconfiglib>=0.13.1,<0.14",
]

[project.optional-dependencies]
# Config-file loading for the CLI (YAML with !include).
config = ["pyyaml"]
# The optional template engines are tplx's; each extra installs that one's
# library. A file whose engine is missing fails naming tplx's extra.
mako = ["tplx[mako]"]
liquid = ["tplx[liquid]"]
handlebars = ["tplx[handlebars]"]
mustache = ["tplx[mustache]"]
# DHCP backends. Each is imported only when a config names its scheme, so a
# netboot install carries none of these unless it asks for them. dnsmasq needs
# nothing for a local server, and windhcp nothing over its default ssh
# transport (it uses the system ssh client). http(s) repository services need
# no extra: uripath sends them on the standard library.
kea = ["requests"]                       # kea:// control agent
dhcpd = ["pypureomapi"]                  # dhcpd:// OMAPI
winrm = ["pywinrm"]                      # windhcp://...?transport=winrm
ssh = ["sftppath[uri,paramiko]>=0.1.0,<0.2"]  # dnsmasq:// over sftp:// paths
# The dnspython resolver backend for netimps' resolve(), used to look up
# hostname targets. netimps >=0.2.0 makes dnspython optional, so this extra is
# the only thing that installs it: with it, resolution has full record-type and
# explicit-nameserver support; without it, resolve() still works through
# netimps' system/nslookup backends (address and reverse records only).
dns = ["dnspython"]
dev = [
    "black",
    "build",
    "hatchling",
    "pytest",
    "pytest-cov",
    "twine",
    "pyyaml",
    "dnspython",
    "requests",
    # Backend dependencies, so their tests run rather than skip.
    "pypureomapi",
    "pywinrm",
    # Template engines behind an extra, so their tests run rather than skip.
    "mako",
    "python-liquid",
    "pybars3",
    "chevron",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    # 12.2 made Highlight(md) required; mkdocstrings 1.0.6 (the newest on 3.10) omits it.
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[project.scripts]
pixie = "netboot.main:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netboot/"
Issues = "https://github.com/jose-pr/netboot/issues"
Repository = "https://github.com/jose-pr/netboot"
Documentation = "https://jose-pr.github.io/netboot/"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/netboot/AGENTS.md (the API header) ships automatically by living in the
# package dir -- force-including it from anywhere else would collide with that
# copy and fail the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "netboot/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` covers dotfiles; `*.local.*` does not start with a dot, so a personal
# override needs its own pattern or it ships.
exclude = ["/.*", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/netboot"]
exclude = ["*.local.*"]

[tool.black]
# Pinned to the project's minimum supported Python so black never emits syntax
# the floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
