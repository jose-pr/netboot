[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netboot"
version = "0.4.0"
authors = [{ name = "Jose A." }]
description = "PXE provisioning management: render netboot artifacts and drive DHCP for targets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Boot",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # The DHCP servers netboot arms: dnsmasq, Kea, ISC dhcpd and Windows DHCP.
    # Imported as `dhcpctl`.
    # Importing it imports no backend dependency; the extras below add them.
    "pydhcpctl>=0.1.0,<0.2",
    "duho>=0.7.6,<0.8",
    # The 0.4 series has `split_host`, `MACAddress.format` and
    # `MACAddress.is_valid`, all of which netboot calls, and `resolve()`
    # answers [] for a name that does not resolve; 0.4.1 is pydhcpctl's floor.
    "netimps>=0.4.1,<0.5",
    # The path layer and its URI layer (`http`, `file`, `ftp`, ... services,
    # and the `sftp://` class sftppath registers). Both run on the standard
    # library; the 0.1 series is the first with the `uripath` import name, and
    # 0.1.2 is pydhcpctl's floor.
    "pathapi>=0.1.2,<0.2",
    "pathapi-uri>=0.1.0,<0.2",
    # Templates are rendered by tplx; `.j2` is the engine netboot's own
    # examples and docs use, so it is always installed. 0.2 is what anycfg's
    # interpolation needs.
    "tplx[jinja]>=0.2.0,<0.3",
    # Layered config with `!include`, and the typed-namespace base of netboot's
    # config objects; `templates` renders `{{ ... }}` in values.
    "anycfg[templates]>=0.14.0,<0.15",
]

[project.optional-dependencies]
# Config-file loading for the CLI (YAML with !include).
config = ["anycfg[yaml]>=0.14.0,<0.15"]
# The optional template engines are tplx's; each extra installs that one's
# library. A file whose engine is missing fails naming tplx's extra.
mako = ["tplx[mako]>=0.2.0,<0.3"]
liquid = ["tplx[liquid]>=0.2.0,<0.3"]
handlebars = ["tplx[handlebars]>=0.2.0,<0.3"]
mustache = ["tplx[mustache]>=0.2.0,<0.3"]
# DHCP backends are dhcpctl's; each extra installs that one's library, and a
# backend is imported only when a config names its scheme. dnsmasq needs
# nothing for a local server, and windhcp nothing over its local transport.
# http(s) repository services need no extra: uripath sends them on the
# standard library.
kea = ["pydhcpctl[kea]>=0.1.0,<0.2"]       # kea:// control agent
dhcpd = ["pydhcpctl[dhcpd]>=0.1.0,<0.2"]   # dhcpd:// OMAPI
winrm = ["pydhcpctl[winrm]>=0.1.0,<0.2"]   # windhcp://...?transport=winrm
ssh = ["pydhcpctl[ssh]>=0.1.0,<0.2"]       # windhcp:// over ssh; dnsmasq:// remote
# The dnspython resolver backend for netimps' resolve(), used to look up
# hostname targets. netimps >=0.2.0 makes dnspython optional, so this extra is
# the only thing that installs it: with it, resolution has full record-type and
# explicit-nameserver support; without it, resolve() still works through
# netimps' system/nslookup backends (address and reverse records only).
dns = ["netimps[dns]>=0.4.1,<0.5"]
dev = [
    # Every extra with tests, so they run rather than skip, within the ranges
    # a user gets.
    "netboot[config,dns,mako,liquid,handlebars,mustache,kea,dhcpd,winrm]",
    "black",
    "build",
    "hatchling",
    "pytest",
    "pytest-cov",
    "twine",
]
docs = [
    # MkDocs 2 drops the plugin system mkdocstrings needs.
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    # 12.2 made Highlight(md) required; mkdocstrings 1.0.6 (the newest on 3.10) omits it.
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[project.scripts]
pixie = "netboot.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netboot/"
Issues = "https://github.com/jose-pr/netboot/issues"
Repository = "https://github.com/jose-pr/netboot"
Documentation = "https://jose-pr.github.io/netboot/"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/netboot/AGENTS.md (the API header) ships automatically by living in the
# package dir -- force-including it from anywhere else would collide with that
# copy and fail the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "netboot/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` covers dotfiles; `*.local.*` does not start with a dot, so a personal
# override needs its own pattern or it ships.
# The repo-root AGENTS.md orients a contributor in a checkout and the
# benchmarks measure one; neither is for an installed consumer.
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/netboot"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
# Pinned to the project's minimum supported Python so black never emits syntax
# the floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
