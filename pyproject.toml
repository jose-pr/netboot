[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netboot"
version = "0.1.1"
authors = [{ name = "Jose A." }]
description = "PXE provisioning management: render netboot artifacts and drive DHCP for targets"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Boot",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "duho>=0.4.1",
    "netimps>=0.2.1",
    "pathlib_next[uri]>=0.8.2",
    "jinja2",
    "yaconfiglib>=0.10.0",
]

[project.optional-dependencies]
# Config-file loading for the CLI (YAML with !include).
config = ["pyyaml"]
# The dnspython resolver backend for netimps' resolve(), used to look up
# hostname targets. netimps >=0.2.0 makes dnspython optional, so this extra is
# the only thing that installs it: with it, resolution has full record-type and
# explicit-nameserver support; without it, resolve() still works through
# netimps' system/nslookup backends (address and reverse records only).
dns = ["dnspython"]
dev = ["black", "build", "hatchling", "pytest", "pytest-cov", "twine", "pyyaml", "dnspython"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pixie = "netboot.main:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netboot/"
Issues = "https://github.com/jose-pr/netboot/issues"
Repository = "https://github.com/jose-pr/netboot"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/netboot/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "netboot/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/.agents"]

[tool.hatch.build.targets.wheel]
packages = ["src/netboot"]

[tool.black]
# Pinned to the project's minimum supported Python so black never emits syntax
# the floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
