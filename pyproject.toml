[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netboot"
version = "0.2.3"
authors = [{ name = "Jose A." }]
description = "PXE provisioning management: render netboot artifacts and drive DHCP for targets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Boot",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "duho>=0.5.0,<0.6",
    # Above the .0 deliberately: 0.3.0 made resolve() raise ResolutionError
    # when no backend could even ask (a resolver outage), and 0.3.1 restored
    # [] as the default (strict=False). PixieTarget and Host.try_ip rely on
    # that: every target is built at startup, so a raise would fail every
    # command. Don't normalize this back to 0.3.0.
    "netimps>=0.3.1,<0.4",
    # Above the .0 deliberately, measured 2026-09-17: recursive `!include`
    # globs (`sub/**/*.yaml`) break on pathlib_next >=0.9.5 unless yaconfiglib
    # is >=0.12.0, and yaconfiglib 0.12.0 itself requires pathlib-next>=0.9.9.
    # Declaring the real floor keeps the pair honest instead of leaving pip to
    # discover it. tests/test_config_discovery.py fails below it.
    "pathlib_next[uri]>=0.9.9,<0.10",
    # 3.0 is the floor that can actually be imported: 2.x calls
    # markupsafe.soft_unicode, removed in MarkupSafe 2.1, so an unpinned
    # resolve can install a jinja2/markupsafe pair that fails on import.
    "jinja2>=3.0,<4",
    "yaconfiglib>=0.13.0,<0.14",
]

[project.optional-dependencies]
# Config-file loading for the CLI (YAML with !include).
config = ["pyyaml"]
# http/https repository services. pathlib_next's uri scheme handler for
# http(s) imports `requests` at module import, and nothing else installs it --
# pathlib_next[uri] does not. Repos served over file/tftp, and rendering in
# general, need none of it, so this stays an extra rather than a dependency.
http = ["requests"]
# DHCP backends. Each is imported only when a config names its scheme, so a
# netboot install carries none of these unless it asks for them. dnsmasq needs
# nothing for a local server, and windhcp nothing over its default ssh
# transport (it uses the system ssh client).
kea = ["requests"]                       # kea:// control agent
dhcpd = ["pypureomapi"]                  # dhcpd:// OMAPI
winrm = ["pywinrm"]                      # windhcp://...?transport=winrm
ssh = ["pathlib_next[sftp]"]             # dnsmasq:// over sftp:// paths
# The dnspython resolver backend for netimps' resolve(), used to look up
# hostname targets. netimps >=0.2.0 makes dnspython optional, so this extra is
# the only thing that installs it: with it, resolution has full record-type and
# explicit-nameserver support; without it, resolve() still works through
# netimps' system/nslookup backends (address and reverse records only).
dns = ["dnspython"]
dev = [
    "black",
    "build",
    "hatchling",
    "pytest",
    "pytest-cov",
    "twine",
    "pyyaml",
    "dnspython",
    "requests",
    # Backend dependencies, so their tests run rather than skip.
    "pypureomapi",
    "pywinrm",
]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pixie = "netboot.main:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netboot/"
Issues = "https://github.com/jose-pr/netboot/issues"
Repository = "https://github.com/jose-pr/netboot"
Documentation = "https://jose-pr.github.io/netboot/"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/netboot/AGENTS.md (the API header) ships automatically by living in the
# package dir -- force-including it from anywhere else would collide with that
# copy and fail the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "netboot/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` covers dotfiles; `*.local.*` does not start with a dot, so a personal
# override needs its own pattern or it ships.
exclude = ["/.*", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/netboot"]
exclude = ["*.local.*"]

[tool.black]
# Pinned to the project's minimum supported Python so black never emits syntax
# the floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
