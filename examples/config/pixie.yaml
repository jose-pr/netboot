# A complete, runnable netboot config. See examples/README.md.

globals:
  domain: example.com

targets:
  web01:
    ip: 10.0.0.10
    image: debian
  "aa:bb:cc:dd:ee:ff":       # MAC-keyed: no IP, so it names its zone
    image: debian
    hostname: db01
    dhcpzone: lan

images:
  debian:
    template_path: [debian]        # relative: searched inside the template root
    globals:
      kernel: vmlinuz
    # What this image tells DHCP clients to boot. Merged into the options every
    # backend sends; see docs/configuration.md.
    dhcp_options:
      boot-file-name: pxelinux.0
      next-server: 10.0.0.2

dhcpzones:
  lan:
    network: 10.0.0.0/24
    domain: example.com
    gateway: 10.0.0.1
    nameservers: [10.0.0.53]
    search: [example.com]
    dhcpservers:
      # Handled by examples/plugins/recording.py, imported with --load-module,
      # so this example runs with no DHCP server at all.
      - recording://dhcp-host
      # A real one looks like this -- swap it in when you have a dnsmasq. The
      # query carries the options the server hands the client; the boot file
      # comes from the image below, because it varies per target.
      # - dnsmasq:///?hostsfile=/etc/dnsmasq.d/netboot.d/&router=10.0.0.1

repos:
  mirror:
    address: 10.0.0.2
    services:
      tftp: /debian
    local: /srv/mirror/debian
