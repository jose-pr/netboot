# A complete, runnable netboot config. See examples/README.md.

# Relative to this file's directory; without it the root is ./templates here.
templates: ../templates

globals:
  domain: example.com

targets:
  web01:
    ip: 10.0.0.10
    mac: "52:54:00:00:00:10"   # quoted: an all-digit MAC is a YAML number
    image: debian
  "aa:bb:cc:dd:ee:ff":       # MAC-keyed
    image: debian
    hostname: db01
    ip: 10.0.0.11            # given, so db01 is never looked up in DNS
    dhcpzone: lan            # named; without an ip it would have to be

images:
  debian:
    template_path: [debian]        # relative: searched inside the template root
    globals:
      kernel: vmlinuz
    # What this image tells DHCP clients to boot. Merged into the options every
    # backend sends; see docs/configuration.md.
    dhcp_options:
      boot-file-name: pxelinux.0
      next-server: 10.0.0.2

dhcpzones:
  lan:
    network: 10.0.0.0/24
    domain: example.com
    gateway: 10.0.0.1
    nameservers: [10.0.0.53]
    search: [example.com]
    dhcpservers:
      # Handled by examples/plugins/recording.py, imported with --load-module,
      # so this example runs with no DHCP server at all.
      - recording://dhcp-host
      # A real one looks like this -- swap it in when you have a dnsmasq. The
      # URI says only where dnsmasq reads its hosts and options directories;
      # what a client is served comes from the zone, the image and the target.
      # dnsmasq keys a reservation by MAC, which is why each target has one.
      # - dnsmasq:///?hostsfile=/etc/dnsmasq.d/netboot/hosts/&optsfile=/etc/dnsmasq.d/netboot/opts/

repos:
  mirror:
    address: 10.0.0.2
    services:
      tftp: /debian                # what the boot loader fetches
      http: /debian                # what the installer fetches
    local: /srv/mirror/debian
